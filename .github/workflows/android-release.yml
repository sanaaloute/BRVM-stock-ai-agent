# Build the signed Android App Bundle for Google Play.
#
# Trigger: manually from the Actions tab ("Run workflow"), or by pushing a
# tag like `v1.1.0`. The signed AAB is uploaded as a workflow artifact.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   base64 of android/app/upload-keystore.jks
#   KEYSTORE_PASSWORD store password
#   KEY_ALIAS         upload key alias ("upload")
#   KEY_PASSWORD      key password
# Generate once locally:
#   base64 -i mobile/brvm_mobile/android/app/upload-keystore.jks | pbcopy

name: Android release (AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/brvm_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle (signed, points at production gateway)
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: kora-bourse-release-aab
          path: mobile/brvm_mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
