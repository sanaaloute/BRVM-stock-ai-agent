# 
name: kora

services:
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brvm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: brvm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brvm -d brvm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Cap the json-file log driver (uncapped it grows unbounded on an always-on
    # host). Same block on the api service below.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build: .
    image: realtimestock-bot:latest
    command: python -m scripts.run_api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://brvm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/brvm
      - API_PORT=8000
      - API_BIND=0.0.0.0
      - AFRIKIA_API_KEY=${AFRIKIA_API_KEY:?Set AFRIKIA_API_KEY in .env (see .env.example)}
      - AFRIKIA_BASE_URL=${AFRIKIA_BASE_URL:-https://afrikia.neobytech.net/v1}
      - AFRIKIA_MODEL=${AFRIKIA_MODEL:-gpt-oss-20b}
      - TZ=${TZ:-Africa/Abidjan}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - bot_data:/app/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  bot_data:
  postgres_data:
